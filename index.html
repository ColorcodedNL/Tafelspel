<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Speels oefenspel voor de tafels van 1 t/m 10: oefenen, tafels invullen en overhoren.">
<meta name="theme-color" content="#FAF4E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tafelspel">
<link rel="icon" type="image/png" sizes="32x32" href="tafelspel-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="tafelspel-favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="tafelspel-apple-touch-icon.png">
<title>Tafelspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }
/* Geen dubbeltik-zoom op iPad bij snel tikken op knoppen */
button, .tr-input { touch-action: manipulation; -webkit-user-select: none; user-select: none; }

:root {
  --creme:           #FAF4E6;
  --warm-white:      #FFFFFF;
  --ink:             #1F3A4D;
  --muted:           #A8B5C0;
  --brown-mid:       #5A7184;

  --terracotta:      #EE5B4C;
  --terracotta-soft: #FCE3E0;
  --sage:            #5BBE7C;
  --mustard:         #E0A920;
  --mustard-soft:    #FFF6DC;
  --sky:             #2B8AE0;
  --sky-soft:        #DCEBF9;
  --berry:           #9B7BC2;

  --shadow-flat:     0 3px 0 rgba(31, 58, 77, 0.16);
  --shadow-press:    0 5px 0 rgba(31, 58, 77, 0.22);
}

body {
  font-family: 'Fredoka', system-ui, sans-serif;
  color: var(--ink);
  background-color: var(--creme);
  min-height: 100vh;
  /* Playful colour blooms + paper grain — same recipe as Breukenspel */
  background-image:
    radial-gradient(ellipse 55% 45% at 12% 8%, rgba(255, 203, 61, 0.28), transparent 65%),
    radial-gradient(ellipse 50% 40% at 92% 90%, rgba(238, 91, 76, 0.22), transparent 60%),
    radial-gradient(ellipse 45% 40% at 96% 14%, rgba(43, 138, 224, 0.18), transparent 70%),
    radial-gradient(ellipse 35% 30% at 6% 88%, rgba(31, 175, 184, 0.20), transparent 65%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.23  0 0 0 0 0.30  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  background-size: auto, auto, auto, auto, 240px 240px;
  background-attachment: fixed;
  position: relative;
}

/* Decorative organic blobs in the corners */
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 0;
  filter: blur(1px);
  opacity: 0.7;
}
body::before {
  width: 240px; height: 220px;
  left: -80px; top: -70px;
  background: radial-gradient(circle at 60% 40%, rgba(255, 203, 61, 0.55), transparent 65%);
  border-radius: 62% 38% 55% 45% / 48% 52% 48% 52%;
}
body::after {
  width: 280px; height: 260px;
  right: -100px; bottom: -90px;
  background: radial-gradient(circle at 40% 50%, rgba(31, 175, 184, 0.40), transparent 65%);
  border-radius: 42% 58% 60% 40% / 55% 45% 55% 45%;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 16px 32px;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header h1 {
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.5px;
}
.header h1 span { color: var(--terracotta); }

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  background: rgba(31,58,77,0.08);
  border-radius: 999px;
  padding: 5px;
  margin-bottom: 22px;
}
.tab {
  flex: 1;
  padding: 11px 6px;
  border-radius: 999px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--brown-mid);
  text-align: center;
  transition: transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  line-height: 1.2;
}
.tab:active { transform: translateY(1px); }
.tab.active {
  color: #fff;
  box-shadow: var(--shadow-flat);
}
.tab.active[data-tab="tafels"] { background: var(--sky); }
.tab.active[data-tab="oefenen"] { background: var(--terracotta); }
.tab.active[data-tab="overhoring"] { background: var(--berry); }

/* Keuze kiezen / zelf typen bij Oefenen */
.modus-keuze {
  display: flex;
  gap: 4px;
  width: fit-content;
  margin: 0 auto 16px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(31,58,77,0.08);
}
.modus-btn {
  padding: 8px 18px;
  border: none;
  border-radius: 999px;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  color: var(--brown-mid);
  cursor: pointer;
}
.modus-btn.actief { background: #fff; color: var(--ink); box-shadow: var(--shadow-flat); }

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Card */
.card {
  background: var(--warm-white);
  border-radius: 26px 22px 28px 24px / 24px 28px 22px 26px;
  padding: 20px;
  box-shadow: var(--shadow-flat), 0 10px 24px -14px rgba(31,58,77,0.3);
  margin-bottom: 14px;
}

/* Som display */
.som-display {
  text-align: center;
  margin-bottom: 16px;
}
.som-tekst {
  font-size: 52px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -1px;
  line-height: 1;
}
.som-tekst .vraagteken { color: var(--terracotta); }

/* Bolletjes */
.bolletjes-wrap {
  margin: 16px auto 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  min-height: 60px;
}
.bolletjes-rij {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.bolletje {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: inline-block;
  box-shadow: inset 0 0 0 2px rgba(31,58,77,0.18);
  animation: plop .2s ease backwards;
}
@keyframes plop { from { opacity: 0; transform: scale(0); } }

/* Antwoord knoppen (multiple choice) */
.antwoord-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.antwoord-btn {
  padding: 18px 10px;
  border-radius: 20px 16px 20px 16px / 16px 20px 16px 20px;
  border: none;
  background: #fff;
  font-family: inherit;
  font-size: 28px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  text-align: center;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: var(--shadow-flat);
}
.antwoord-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-press); }
.antwoord-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
.antwoord-btn:nth-child(1) { background: #BCDCF6; }
.antwoord-btn:nth-child(2) { background: #FBE091; }
.antwoord-btn:nth-child(3) { background: #DBC6EE; }
.antwoord-btn:nth-child(4) { background: #ABE4E8; }
.antwoord-btn.goed {
  background: var(--sage);
  color: #fff;
  box-shadow: var(--shadow-press);
}
.antwoord-btn.fout {
  background: var(--terracotta);
  color: #fff;
  animation: schud .35s ease;
}
@keyframes schud {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}

/* Tafel kiezen */
.tafel-kies-label {
  font-size: 17px;
  font-weight: 600;
  color: var(--brown-mid);
  text-align: center;
  margin-bottom: 12px;
}
.tafel-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-bottom: 14px;
}
.tafel-btn {
  aspect-ratio: 1;
  border-radius: 18px 14px 18px 14px / 14px 18px 14px 18px;
  border: none;
  background: var(--mustard-soft);
  font-family: inherit;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  color: var(--mustard);
  text-align: center;
  transition: transform .12s ease, box-shadow .12s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-flat);
}
.tafel-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-press); }
.tafel-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
.tafel-btn.active-tafel {
  background: var(--mustard);
  color: #fff;
  box-shadow: var(--shadow-press);
}

/* Tafelkeuze bij Oefenen (compact) */
.oef-kies {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
  margin-bottom: 18px;
}
.oef-kies .tafel-btn {
  aspect-ratio: auto;
  height: 46px;
  font-size: 20px;
  border-radius: 15px 12px 15px 12px / 12px 15px 12px 15px;
}
.oef-kies .tafel-btn.alle {
  grid-column: span 2;
  background: var(--terracotta-soft);
  color: var(--terracotta);
  font-size: 17px;
}
.oef-kies .tafel-btn.alle.active-tafel {
  background: var(--terracotta);
  color: #fff;
}

/* Tafel-lijst */
.tafel-lijst-titel {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  margin-bottom: 4px;
}
.tafel-lijst-sub {
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  text-align: center;
  margin-bottom: 16px;
}
.tafel-lijst {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tafel-rij {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--creme);
  border-radius: 16px 13px 16px 13px / 13px 16px 13px 16px;
  padding: 11px 16px;
}
.tr-som {
  font-size: 25px;
  font-weight: 600;
  color: var(--ink);
  flex: 1;
  font-variant-numeric: tabular-nums;
}
.tr-eq {
  font-size: 22px;
  font-weight: 600;
  color: var(--muted);
}
.tr-input {
  width: 78px;
  min-height: 46px;
  text-align: center;
  font-family: inherit;
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  background: #fff;
  border: 2.5px solid var(--muted);
  border-radius: 999px;
  padding: 5px 8px;
  box-shadow: var(--shadow-flat);
  font-variant-numeric: tabular-nums;
  transition: box-shadow .12s ease, background .2s ease, border-color .2s ease, color .2s ease, transform .1s ease;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.tr-input.leeg { color: #C9D2DA; }
.tr-input.selected {
  border-color: var(--sky);
  box-shadow: 0 0 0 4px var(--sky-soft), var(--shadow-flat);
  background: var(--sky-soft);
}
.tafel-rij.goed .tr-input {
  background: var(--sage);
  color: #fff;
  border-color: var(--sage);
  box-shadow: var(--shadow-flat);
}
.tafel-rij.fout .tr-input {
  border-color: var(--terracotta);
  animation: schud .35s ease;
}

/* Tafel cijferpad */
.tafel-numpad {
  display: none;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
  position: sticky;
  bottom: 10px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(6px);
  padding: 10px;
  border-radius: 20px;
  box-shadow: 0 -2px 14px -6px rgba(31,58,77,0.25), var(--shadow-flat);
  transition: opacity .2s ease;
}
.tafel-numpad.actief { display: grid; }
.tafel-numpad .num-btn { padding: 14px 10px; }

/* Goed banner */
.goed-banner {
  background: var(--sage);
  border-radius: 24px 28px 22px 26px / 26px 22px 28px 24px;
  padding: 18px;
  text-align: center;
  margin-top: 14px;
  box-shadow: var(--shadow-press);
}
.goed-tekst { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; }
.volgende-btn {
  padding: 12px 28px;
  border-radius: 999px;
  border: none;
  background: #fff;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  color: var(--sage);
  box-shadow: var(--shadow-flat);
  transition: transform .1s ease;
}
.volgende-btn:hover { transform: translateY(-2px); }
.volgende-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }

/* Nummerpad */
.nummerpad-wrap { margin-top: 16px; }
.input-display {
  background: var(--sky-soft);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
  font-size: 44px;
  font-weight: 700;
  color: var(--ink);
  min-height: 74px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  border: 3px solid transparent;
  transition: border-color .2s;
}
.input-display.fout { border-color: var(--terracotta); animation: schud .35s ease; }
.input-display.goed { border-color: var(--sage); }
.input-display.leeg { color: var(--muted); font-weight: 500; }
.nummerpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.num-btn {
  padding: 16px 10px;
  border-radius: 18px;
  border: none;
  background: #DCE8F4;
  font-family: inherit;
  font-size: 26px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  text-align: center;
  transition: transform .1s ease, box-shadow .1s ease;
  box-shadow: var(--shadow-flat);
}
.num-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-press); }
.num-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
.num-btn.del { background: var(--terracotta); color: #fff; }
.num-btn.ok { background: var(--sage); color: #fff; }
.nul-melding {
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--terracotta);
  margin: -4px 0 8px;
  min-height: 18px;
  visibility: hidden;
}
.nul-melding.zichtbaar { visibility: visible; }

/* Score overhoring */
.ov-voortgang {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--brown-mid);
  margin-bottom: 10px;
}
.score-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.score-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(31,58,77,0.12);
  transition: background .3s, transform .2s, box-shadow .2s;
}
.score-dot.goed { background: var(--sage); }
.score-dot.fout { background: var(--terracotta); }
.score-dot.huidig {
  transform: scale(1.35);
  box-shadow: 0 0 0 3px var(--sky-soft), 0 0 0 5px var(--sky);
}

/* Overhoring overzicht */
.ov-overzicht {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 18px 0 6px;
  text-align: left;
}
.ov-ov-rij {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--creme);
  border-radius: 13px 10px 13px 10px / 10px 13px 10px 13px;
  padding: 8px 11px;
}
.ov-ov-icoon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.ov-ov-icoon.goed { background: var(--sage); }
.ov-ov-icoon.fout { background: var(--terracotta); }
.ov-ov-som {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ov-ov-som .jouw {
  color: var(--terracotta);
  text-decoration: line-through;
  margin-left: 2px;
}
.ov-ov-som .echt { color: var(--ink); margin-left: 4px; font-weight: 700; }

/* Eindresultaat overhoring */
.eindresultaat {
  background: var(--warm-white);
  border-radius: 28px 24px 26px 22px / 22px 26px 24px 28px;
  padding: 28px 20px;
  box-shadow: var(--shadow-flat), 0 10px 24px -14px rgba(31,58,77,0.3);
  text-align: center;
}
.eindresultaat .groot-getal {
  font-size: 72px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
.eindresultaat .van { font-size: 28px; font-weight: 500; color: var(--muted); }
.eindresultaat .beoordeling { font-size: 22px; font-weight: 700; margin: 10px 0 20px; }

/* Alle tafels knop */
.alle-tafels-btn {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: var(--terracotta-soft);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  color: var(--terracotta);
  margin-bottom: 14px;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: var(--shadow-flat);
}
.alle-tafels-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-press); }
.alle-tafels-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
.alle-tafels-btn.active-tafel {
  background: var(--terracotta);
  color: #fff;
  box-shadow: var(--shadow-press);
}

/* Opnieuw / nieuw knop */
.actie-btn {
  padding: 13px 26px;
  border-radius: 999px;
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}
.actie-btn.primair { background: var(--terracotta); color: #fff; box-shadow: var(--shadow-press); }
.actie-btn.secundair { background: var(--sky-soft); color: var(--sky); box-shadow: var(--shadow-flat); }
.actie-btn:hover { transform: translateY(-2px); }
.actie-btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
.btn-rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* Iconen (SVG i.p.v. emoji) */
.ico, .ico-times { display: inline-flex; align-items: center; justify-content: center; }
.ico svg { vertical-align: middle; }
.tab .ico { margin-right: 6px; vertical-align: -0.18em; }
.tab .ico svg { vertical-align: middle; }
.header h1 .ico-times { color: var(--terracotta); vertical-align: -0.16em; margin-left: 2px; }
.alle-tafels-btn .ico, .actie-btn .ico { margin-left: 6px; vertical-align: -0.16em; }
.goed-emoji { color: #fff; display: block; margin: 0 auto 8px; line-height: 0; }
#ov-einde-emoji { line-height: 0; }

/* Confetti canvas */
#confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }

@media (orientation: landscape) and (max-height: 600px) {
  .app { padding: 8px 12px 16px; }
  .header { margin-bottom: 8px; }
  .header h1 { font-size: 22px; }
  .tabs { margin-bottom: 10px; }
  .tab { padding: 7px 4px; font-size: 12px; }
  .card { padding: 12px; border-radius: 18px; }
  .som-tekst { font-size: 36px; }
  .bolletje { width: 18px; height: 18px; }
  .bolletjes-wrap { gap: 4px; min-height: 40px; margin-top: 8px; }
  .antwoord-btn { font-size: 22px; padding: 12px 8px; border-radius: 14px; }
  .antwoord-grid { gap: 7px; margin-top: 10px; }
  .tafel-grid { gap: 5px; }
  .tafel-btn { font-size: 17px; border-radius: 12px; }
  .oef-kies { gap: 5px; margin-bottom: 10px; }
  .oef-kies .tafel-btn { height: 36px; font-size: 16px; border-radius: 12px; }
  .oef-kies .tafel-btn.alle { font-size: 14px; }
  .modus-keuze { margin-bottom: 8px; }
  .modus-btn { padding: 6px 14px; font-size: 13px; }
  .num-btn { padding: 11px 8px; font-size: 20px; border-radius: 12px; }
  .input-display { font-size: 32px; min-height: 54px; padding: 10px; margin-bottom: 8px; }
  .nummerpad { gap: 5px; }
}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">
  <div class="header">
    <h1>Tafel<span>spel</span> <span class="ico-times" data-icon="times" data-size="30"></span></h1>
  </div>

  <div class="tabs">

<script>
// ========== ICONEN (SVG i.p.v. emoji) ==========
const ICONS = {
  dice: '<rect x="3.5" y="3.5" width="17" height="17" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/>',
  grid: '<circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="18" cy="6" r="2" fill="currentColor"/><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="12" r="2" fill="currentColor"/><circle cx="6" cy="18" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/>',
  star: '<path d="M12 3.1l2.55 5.45 5.95.62a1 1 0 0 1 .57 1.74l-4.45 4 1.25 5.85a1 1 0 0 1-1.48 1.07L12 16.9l-5.16 2.93a1 1 0 0 1-1.48-1.07l1.25-5.85-4.45-4a1 1 0 0 1 .57-1.74l5.95-.62z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>',
  sparkle: '<path d="M12 1.8c.85 5.1 4.3 8.55 9.4 9.4-5.1.85-8.55 4.3-9.4 9.4-.85-5.1-4.3-8.55-9.4-9.4 5.1-.85 8.55-4.3 9.4-9.4z" fill="currentColor"/>',
  trophy: '<path d="M6.5 4h11v3.2a5.5 5.5 0 0 1-11 0V4z" fill="currentColor"/><path d="M6.5 5.2H3.6v1.4a3 3 0 0 0 3 3M17.5 5.2h2.9v1.4a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 12.5v3.5M8.5 20h7M10 20l.6-4h2.8l.6 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
  thumb: '<path d="M3.5 10.5h3v9h-3z" fill="currentColor"/><path d="M6.5 11l3.2-6.6c1.5-.1 2.5 1 2.3 2.4l-.6 3.2h4.4a2 2 0 0 1 2 2.4l-1.1 5.6a2.2 2.2 0 0 1-2.2 1.8H6.5z" fill="currentColor"/>',
  rocket: '<circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16.5V8m0 0l-3.2 3.2M12 8l3.2 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  play: '<path d="M7.5 5.2l11.5 6.8L7.5 18.8z" fill="currentColor"/>',
  redo: '<path d="M19.5 12a7.5 7.5 0 1 1-2.3-5.4M19.8 4.2v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
  cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>',
  times: '<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>'
};
function icon(name, size = 24) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true" focusable="false">${ICONS[name] || ''}</svg>`;
}
function renderIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    const s = parseInt(el.getAttribute('data-size')) || 24;
    el.innerHTML = icon(el.getAttribute('data-icon'), s);
  });
}

// ========== CONFETTI ==========
let confParticles = [], confRaf = null;
function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  confParticles = [];
  const colors = ['#2B8AE0','#EE5B4C','#FFCB3D','#1FAFB8','#5BBE7C','#F4A1B3','#9B7BC2','#1E6BB8','#C9412F','#3D9659'];
  for (let i = 0; i < 140; i++) {
    confParticles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360, rotV: (Math.random() - 0.5) * 10,
      vy: 3 + Math.random() * 5, vx: (Math.random() - 0.5) * 3, alpha: 1
    });
  }
  if (confRaf) cancelAnimationFrame(confRaf);
  animateConfetti();
  setTimeout(() => { confParticles = []; }, 3000);
}
function animateConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confParticles.forEach(p => {
    p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
    if (p.y > canvas.height * 0.65) p.alpha = Math.max(0, p.alpha - 0.03);
    ctx.save(); ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });
  confParticles = confParticles.filter(p => p.alpha > 0);
  if (confParticles.length > 0) confRaf = requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ========== HELPERS ==========
const $ = id => document.getElementById(id);
let actieveTab = 'tafels';

function switchTab(t) {
  actieveTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + t));
}

// Leeg laten bij tonen, zodat de eigen CSS-weergave (block, grid) blijft gelden
function toon(id, zichtbaar) { $(id).style.display = zichtbaar ? '' : 'none'; }

// Invoerveld boven een cijferpad (Oefenen en Overhoring)
function toonInvoer(id, waarde, status = '') {
  const el = $(id);
  el.className = 'input-display' + (waarde === '' ? ' leeg' : '') + (status ? ' ' + status : '');
  el.textContent = waarde || 'Tik een getal';
}

const nulTimers = {};
function toonNulMelding(id) {
  const m = $(id);
  m.classList.add('zichtbaar');
  clearTimeout(nulTimers[id]);
  nulTimers[id] = setTimeout(() => m.classList.remove('zichtbaar'), 1800);
}

// Gedeelde cijferlogica: geeft de nieuwe invoer terug, of null als de toets niets doet
function typCijfer(waarde, k, nulMeldingId) {
  if (k === 'del') return waarde.slice(0, -1);
  if (waarde.length >= 3) return null;
  if (waarde === '' && k === '0') { toonNulMelding(nulMeldingId); return null; }
  return waarde + k;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rnd10() { return 1 + Math.floor(Math.random() * 10); }

// Knoppen 1 t/m 10 in een grid; id's krijgen een prefix zodat ze te markeren zijn
function maakTafelKnoppen(container, prefix, onKlik) {
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'tafel-btn';
    btn.id = `${prefix}-${i}`;
    btn.textContent = i;
    btn.onclick = () => onKlik(i);
    container.appendChild(btn);
  }
}

function markeerTafel(knoppen, actiefId) {
  knoppen.forEach(b => b.classList.toggle('active-tafel', b.id === actiefId));
}

// Cijferpad 1-2-3 bovenaan, onderaan wissen / 0 / klaar
function maakNumpad(container, onTik) {
  container.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'num-btn' + (k === 'del' ? ' del' : k === 'ok' ? ' ok' : '');
    btn.textContent = k === 'del' ? '⌫' : k === 'ok' ? '✓' : k;
    btn.setAttribute('aria-label', k === 'del' ? 'Wissen' : k === 'ok' ? 'Klaar' : k);
    btn.onclick = () => onTik(k);
    container.appendChild(btn);
  });
}

function maakBolletjes(container, a, b) {
  container.innerHTML = '';
  const kleuren = ['#2B8AE0','#EE5B4C','#FFCB3D','#1FAFB8','#9B7BC2'];
  const frag = document.createDocumentFragment();
  for (let r = 0; r < a; r++) {
    const rij = document.createElement('div');
    rij.className = 'bolletjes-rij';
    for (let k = 0; k < b; k++) {
      const dot = document.createElement('div');
      dot.className = 'bolletje';
      dot.style.background = kleuren[r % kleuren.length];
      dot.style.animationDelay = `${(r * b + k) * 25}ms`;
      rij.appendChild(dot);
    }
    frag.appendChild(rij);
  }
  container.appendChild(frag);
}

// Foute opties uit de buurt van de som: een rij meer/minder (bv. 7×3 → 18, 24)
// en een groepje meer/minder, aangevuld met ±1/±2. Zo moet je echt rekenen.
function foutOpties(a, b) {
  const juist = a * b;
  const kandidaten = shuffle([(a - 1) * b, (a + 1) * b, a * (b - 1), a * (b + 1)]);
  const reserve = shuffle([juist - 1, juist + 1, juist - 2, juist + 2]);
  const fout = [];
  for (const v of [...kandidaten, ...reserve]) {
    if (v > 0 && v !== juist && !fout.includes(v)) fout.push(v);
    if (fout.length === 3) break;
  }
  return fout;
}

function maakAntwoordKnoppen(container, a, b, onGoed) {
  container.innerHTML = '';
  const juist = a * b;
  let klaar = false;
  shuffle([juist, ...foutOpties(a, b)]).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'antwoord-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      if (klaar) return;
      if (opt === juist) {
        klaar = true;
        btn.classList.add('goed');
        onGoed();
      } else {
        btn.classList.remove('fout');
        void btn.offsetWidth; // animatie opnieuw starten bij herhaald tikken
        btn.classList.add('fout');
        setTimeout(() => btn.classList.remove('fout'), 400);
      }
    };
    container.appendChild(btn);
  });
}

// ========== OEFENEN ==========
let oVorigA = 0, oVorigB = 0, oTafel = 0, oModus = 'kies', oInput = '', oKlaar = false;

function zetOefenModus(m) {
  oModus = m;
  $('o-modus-kies').classList.toggle('actief', m === 'kies');
  $('o-modus-typ').classList.toggle('actief', m === 'typ');
  nieuweOefenSom();
}

function oefenGoed() {
  oKlaar = true;
  startConfetti();
  toon('o-goed', true);
}

function oefenNumpadTik(k) {
  if (oKlaar) return;
  if (k === 'ok') {
    if (oInput === '') return;
    if (parseInt(oInput, 10) === oVorigA * oVorigB) {
      toonInvoer('o-input', oInput, 'goed');
      oefenGoed();
    } else {
      // fout: kort rood, dan leeg zodat ze opnieuw kan proberen
      toonInvoer('o-input', oInput, 'fout');
      oKlaar = true;
      setTimeout(() => { oInput = ''; oKlaar = false; toonInvoer('o-input', ''); }, 700);
    }
    return;
  }
  const nieuw = typCijfer(oInput, k, 'o-nul-melding');
  if (nieuw === null) return;
  oInput = nieuw;
  toonInvoer('o-input', oInput);
}

function bouwOefenGrid() {
  const grid = $('o-tafel-grid');
  const alle = document.createElement('button');
  alle.className = 'tafel-btn alle';
  alle.id = 'o-t-0';
  alle.textContent = 'Alle';
  alle.onclick = () => selecteerOefenTafel(0);
  grid.appendChild(alle);
  maakTafelKnoppen(grid, 'o-t', selecteerOefenTafel);
  selecteerOefenTafel(0);
}

function selecteerOefenTafel(n) {
  oTafel = n;
  markeerTafel(document.querySelectorAll('#o-tafel-grid .tafel-btn'), `o-t-${n}`);
  nieuweOefenSom();
}

function nieuweOefenSom() {
  toon('o-goed', false);
  let a, b;
  do {
    a = rnd10();
    b = oTafel || rnd10();
  } while (a === oVorigA && b === oVorigB);
  oVorigA = a; oVorigB = b;
  $('o-som').innerHTML = `${a} × ${b} = <span class="vraagteken">?</span>`;
  maakBolletjes($('o-bolletjes'), a, b);
  oKlaar = false;
  oInput = '';
  toon('o-knoppen', oModus === 'kies');
  toon('o-typ', oModus === 'typ');
  if (oModus === 'kies') maakAntwoordKnoppen($('o-knoppen'), a, b, oefenGoed);
  else toonInvoer('o-input', '');
}

// ========== TAFELS ==========
let tafelKlaarGevierd = false, tafelSelectie = null;

function startTafel(n) {
  tafelKlaarGevierd = false;
  tafelSelectie = null;
  toon('t-kies-card', false);
  toon('t-lijst-wrap', true);
  $('t-lijst-titel').textContent = `Tafel van ${n}`;
  $('t-lijst-sub').textContent = 'Tik een rij aan en typ het antwoord';
  const lijst = $('t-lijst');
  lijst.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const rij = document.createElement('div');
    rij.className = 'tafel-rij';
    rij.innerHTML = `<span class="tr-som">${i} × ${n}</span><span class="tr-eq">=</span>`;
    const cel = document.createElement('div');
    cel.className = 'tr-input leeg';
    cel.textContent = '?';
    cel.dataset.juist = i * n;
    cel.dataset.waarde = '';
    cel.setAttribute('role', 'button');
    cel.setAttribute('aria-label', `${i} keer ${n}`);
    cel.addEventListener('click', () => selecteerTafelCel(cel));
    rij.appendChild(cel);
    lijst.appendChild(rij);
  }
  $('t-numpad').classList.remove('actief');
}

function selecteerTafelCel(cel) {
  if (cel.dataset.ok === '1') return; // goede antwoorden blijven staan
  if (tafelSelectie) tafelSelectie.classList.remove('selected');
  tafelSelectie = cel;
  cel.classList.add('selected');
  $('t-numpad').classList.add('actief');
}

function schudRij(rij) {
  rij.classList.remove('fout');
  void rij.offsetWidth;
  rij.classList.add('fout');
  setTimeout(() => rij.classList.remove('fout'), 400);
}

function tafelNumpadTik(k) {
  const cel = tafelSelectie;
  if (!cel || cel.dataset.ok === '1') return;
  if (k === 'ok') { gaNaarVolgendeTafelCel(); return; }
  let waarde = cel.dataset.waarde;
  if (k === 'del') {
    waarde = waarde.slice(0, -1);
  } else {
    if (waarde.length >= 3) return;
    if (waarde === '' && k === '0') { schudRij(cel.parentElement); return; }
    waarde += k;
  }
  cel.dataset.waarde = waarde;
  cel.textContent = waarde || '?';
  cel.classList.toggle('leeg', waarde === '');
  controleerTafelCel(cel);
}

function gaNaarVolgendeTafelCel() {
  const cellen = [...document.querySelectorAll('#t-lijst .tr-input')];
  const idx = cellen.indexOf(tafelSelectie);
  for (let j = 1; j <= cellen.length; j++) {
    const kandidaat = cellen[(idx + j) % cellen.length];
    if (kandidaat.dataset.ok !== '1') { selecteerTafelCel(kandidaat); return; }
  }
}

function controleerTafelCel(cel) {
  const rij = cel.parentElement;
  const waarde = cel.dataset.waarde;
  const juist = cel.dataset.juist;
  rij.classList.remove('goed');
  if (waarde === juist) {
    rij.classList.add('goed');
    cel.dataset.ok = '1';
    cel.classList.remove('selected');
    if (!checkTafelKlaar()) setTimeout(gaNaarVolgendeTafelCel, 250);
  } else if (waarde.length >= juist.length) {
    // pas "fout" tonen als het getal niet meer kan groeien tot het juiste antwoord
    schudRij(rij);
  }
}

function checkTafelKlaar() {
  const cellen = [...document.querySelectorAll('#t-lijst .tr-input')];
  if (tafelKlaarGevierd || !cellen.every(c => c.dataset.ok === '1')) return false;
  tafelKlaarGevierd = true;
  tafelSelectie = null;
  $('t-numpad').classList.remove('actief');
  $('t-lijst-sub').textContent = 'Hele tafel goed, knap gedaan!';
  startConfetti();
  return true;
}

function toonTafelKeuze() {
  toon('t-kies-card', true);
  toon('t-lijst-wrap', false);
  $('t-numpad').classList.remove('actief');
  tafelSelectie = null;
}

// ========== OVERHORING ==========
const OV_TOTAAL = 10;
let ovTafel = 0, ovSommen = [], ovIndex = 0, ovGoed = 0, ovInput = '', ovBeantwoord = false;

function selecteerOverhoringTafel(n) {
  ovTafel = n;
  markeerTafel([...document.querySelectorAll('#ov-tafel-grid .tafel-btn'), $('ov-alle-btn')],
    n === 0 ? 'ov-alle-btn' : `ov-t-${n}`);
}

function genereerOverhoringSommen() {
  if (ovTafel !== 0) {
    const alle = [];
    for (let i = 1; i <= 10; i++) alle.push({ a: i, b: ovTafel });
    return shuffle(alle).slice(0, OV_TOTAAL);
  }
  // alle unieke combinaties (a×b en b×a tellen als één), dan willekeurig gedraaid
  const alle = [];
  for (let a = 1; a <= 10; a++) for (let b = a; b <= 10; b++) alle.push({ a, b });
  return shuffle(alle).slice(0, OV_TOTAAL).map(s => Math.random() < 0.5 ? s : { a: s.b, b: s.a });
}

function startOverhoring() {
  ovSommen = genereerOverhoringSommen();
  ovIndex = 0; ovGoed = 0;
  toon('ov-kies-wrap', false);
  toon('ov-einde-wrap', false);
  toon('ov-speel-wrap', true);
  renderOverhoringSom();
}

function toonOverhoringKeuze() {
  toon('ov-kies-wrap', true);
  toon('ov-speel-wrap', false);
  toon('ov-einde-wrap', false);
}

function renderScoreDots() {
  const container = $('ov-score-dots');
  container.innerHTML = '';
  ovSommen.forEach((som, i) => {
    const dot = document.createElement('div');
    dot.className = 'score-dot';
    if (som.correct === true) dot.classList.add('goed');
    else if (som.correct === false) dot.classList.add('fout');
    if (i === ovIndex) dot.classList.add('huidig');
    container.appendChild(dot);
  });
}

function renderOverhoringSom() {
  const som = ovSommen[ovIndex];
  ovInput = '';
  ovBeantwoord = false;
  $('ov-voortgang').textContent = `Vraag ${ovIndex + 1} van ${OV_TOTAAL}`;
  renderScoreDots();
  $('ov-som').innerHTML = `${som.a} × ${som.b} = <span class="vraagteken">?</span>`;
  toonInvoer('ov-input', '');
}

function numpadTik(k) {
  if (ovBeantwoord) return;
  if (k === 'ok') {
    if (ovInput !== '') controleerOverhoringAntwoord();
    return;
  }
  const nieuw = typCijfer(ovInput, k, 'ov-nul-melding');
  if (nieuw === null) return;
  ovInput = nieuw;
  toonInvoer('ov-input', ovInput);
}

function controleerOverhoringAntwoord() {
  const som = ovSommen[ovIndex];
  som.ingevoerd = parseInt(ovInput, 10);
  som.correct = som.ingevoerd === som.a * som.b;
  if (som.correct) ovGoed++;
  ovBeantwoord = true;
  toonInvoer('ov-input', ovInput, som.correct ? 'goed' : 'fout');
  renderScoreDots();

  setTimeout(() => {
    ovIndex++;
    if (ovIndex >= OV_TOTAAL) toonEindresultaat();
    else renderOverhoringSom();
  }, som.correct ? 550 : 650);
}

function toonEindresultaat() {
  toon('ov-speel-wrap', false);
  toon('ov-einde-wrap', true);
  $('ov-einde-score').textContent = ovGoed;
  $('ov-einde-van').textContent = `van ${OV_TOTAAL}`;

  $('ov-overzicht').innerHTML = ovSommen.map(som => {
    const juist = som.a * som.b;
    const somHtml = som.correct
      ? `${som.a} × ${som.b} = ${juist}`
      : `${som.a} × ${som.b} = <span class="jouw">${som.ingevoerd}</span><span class="echt">${juist}</span>`;
    return `<div class="ov-ov-rij"><span class="ov-ov-icoon ${som.correct ? 'goed' : 'fout'}">${icon(som.correct ? 'check' : 'cross', 14)}</span><span class="ov-ov-som">${somHtml}</span></div>`;
  }).join('');

  const pct = ovGoed / OV_TOTAAL;
  const [ic, tekst, kleur] =
    pct === 1   ? ['trophy', 'Perfect! Geweldig!', 'var(--mustard)'] :
    pct >= 0.8  ? ['star', 'Super goed gedaan!', 'var(--mustard)'] :
    pct >= 0.6  ? ['thumb', 'Goed bezig!', 'var(--sky)'] :
                  ['rocket', 'Blijf oefenen!', 'var(--terracotta)'];
  $('ov-einde-emoji').innerHTML = `<span style="color:${kleur};display:inline-flex">${icon(ic, 52)}</span>`;
  $('ov-beoordeling').textContent = tekst;
  $('ov-beoordeling').style.color = kleur;
  if (pct >= 0.8) startConfetti();
}

// ========== TOETSENBORD (desktop) ==========
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : e.key === 'Enter' ? 'ok' : null;
  if (!k) return;
  if (actieveTab === 'overhoring' && $('ov-speel-wrap').style.display !== 'none') numpadTik(k);
  else if (actieveTab === 'oefenen' && oModus === 'typ') oefenNumpadTik(k);
  else if (actieveTab === 'tafels' && tafelSelectie) tafelNumpadTik(k);
  else return;
  e.preventDefault();
});

// ========== INIT ==========
renderIcons();
maakTafelKnoppen($('t-tafel-grid'), 't-t', startTafel);
maakTafelKnoppen($('ov-tafel-grid'), 'ov-t', selecteerOverhoringTafel);
maakNumpad($('t-numpad'), tafelNumpadTik);
maakNumpad($('ov-numpad'), numpadTik);
maakNumpad($('o-numpad'), oefenNumpadTik);
selecteerOverhoringTafel(0);
bouwOefenGrid();
</script>
</body>
</html>
